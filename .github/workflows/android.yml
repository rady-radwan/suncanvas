name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SunCanvas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests (solar engine + app)
        run: ./gradlew --stacktrace :core-solar:test :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core-solar/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload widget renders (visual review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-renders
          path: app/build/widget-renders/
          if-no-files-found: ignore

      - name: Publish widget renders to the ci-renders branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -d app/build/widget-renders ] && [ "$(ls -A app/build/widget-renders)" ]; then
            cd app/build/widget-renders
            git init -q -b ci-renders
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Widget renders for ${GITHUB_SHA}"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-renders
          fi
