name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SunCanvas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish debug APK (apk branch + "debug-latest" release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mkdir -p /tmp/apkout && cp "$APK" /tmp/apkout/SunCanvas-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest /tmp/apkout/SunCanvas-debug.apk --prerelease \
            --title "SunCanvas debug build" --notes "Latest debug APK built from ${GITHUB_SHA}." --target "${GITHUB_SHA}"
          cd /tmp/apkout
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Debug APK for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Unit tests (solar engine + app)
        run: ./gradlew --stacktrace :core-solar:test :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core-solar/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload widget renders (visual review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-renders
          path: app/build/widget-renders/
          if-no-files-found: ignore

      - name: Publish widget renders to the ci-renders branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p app/build/widget-renders
          if [ -d app/build/screens ]; then cp -r app/build/screens app/build/widget-renders/screens; fi
          if [ "$(ls -A app/build/widget-renders)" ]; then
            cd app/build/widget-renders
            git init -q -b ci-renders
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Widget renders for ${GITHUB_SHA}"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-renders
          fi
