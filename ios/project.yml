name: DayArc
options:
  bundleIdPrefix: com.dayarc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  DayArcCore:
    path: DayArcCore
targets:
  DayArc:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DayArcCore
      - target: DayArcWidget
        embed: true
    entitlements:
      path: App/DayArc.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dayarc.app
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DayArc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: DayArc uses your location once, when you ask, to calculate sunrise and sunset where you are. It is never tracked in the background.
        NSPhotoLibraryUsageDescription: Choose a photo to use as a widget background.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.weather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayarc.app
        PRODUCT_NAME: DayArc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  DayArcWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: DayArcCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/DayArcWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dayarc.app
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DayArc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayarc.app.widget
        PRODUCT_NAME: DayArcWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  DayArc:
    build:
      targets:
        DayArc: all
        DayArcWidget: all
